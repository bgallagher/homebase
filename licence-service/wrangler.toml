name = "rackoon-licence"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Which Paddle environment this deployment serves, and which price(s) earn a licence.
# Secrets are NOT stored here: set them with `wrangler secret put` (see docs/licence-setup.md).
[vars]
PADDLE_ENV = "sandbox"
PADDLE_PRICE_IDS = "pri_01m4k470p76n1yj2nk29rkpvpq"
MAIL_FROM = "Rackoon <licences@rackoon.xrray.net>"

# The licence table: one row per sold licence (who bought, whether the key is still good). Create it with
#   npx wrangler d1 create rackoon-licence      (paste the database_id below)
#   npx wrangler d1 migrations apply rackoon-licence --remote
[[d1_databases]]
binding = "DB"
database_name = "rackoon-licence"
database_id = "79ac9f88-ce0c-4191-bc4c-2e673e415b9f"
