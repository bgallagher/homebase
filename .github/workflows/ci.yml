name: ci
on: [push, pull_request]
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check-spec
  licence-service:
    # The Cloudflare Worker that issues supporter licence keys. Its tests run on plain Node 24, which strips TypeScript types
    # itself and has WebCrypto Ed25519; `npm ci` installs the Paddle SDK, jose and wrangler from the lockfile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: licence-service
      - run: npm test
        working-directory: licence-service
  android-core:
    # The Kotlin mirror of RackoonCore (android/core) and the sshj transport (android/ssh). Core reads spec/ directly, so every golden
    # fixture is checked here too. The real-server probe (android/probe) is run by hand, never in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:test :ssh:test :app:assembleDebug
        working-directory: android
  swift-macos:
    # SwiftTerm 1.99 needs Swift 6.2+. On an older toolchain SwiftPM silently picked SwiftTerm 1.20.0, which lacks the
    # APIs the app uses, so CI failed on every push. macos-26 ships Xcode 26 (Swift 6.2+).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the app's build number is the commit count
      - run: swift --version
      - run: swift test
        working-directory: apple
      - run: swift build --product RackoonMac
        working-directory: apple
      - name: Build the app bundle
        run: |
          # A v1.2.3 tag builds version 1.2.3; any other push builds the default version, named by commit.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            tools/make-app "$VERSION"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            tools/make-app
          fi
          echo "FILE_ID=$VERSION" >> "$GITHUB_ENV"
      - name: Package
        run: |
          cd build
          NAME="Rackoon-${FILE_ID}-macos-arm64.zip"
          ditto -c -k --keepParent Rackoon.app "$NAME"        # keeps the signature and symlinks intact (plain zip does not)
          shasum -a 256 "$NAME" > "$NAME.sha256"
          ls -l "$NAME" "$NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Rackoon-macOS-arm64
          path: |
            build/Rackoon-*-macos-arm64.zip
            build/Rackoon-*-macos-arm64.zip.sha256
          retention-days: 14
          if-no-files-found: error

  # A v* tag publishes the build from this same run as a GitHub Release.
  release:
    needs: [spec, swift-macos, android-core]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Rackoon-macOS-arm64
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag with a suffix (v0.1.0-alpha.1, v0.2.0-beta.1) is published as a pre-release; plain v1.2.3 is a normal release.
          PRE=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* $PRE \
            --repo "$GITHUB_REPOSITORY" \
            --title "Rackoon ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes "Developed by Brian Gallagher (https://github.com/bgallagher). Apple silicon Mac build. It is ad-hoc signed and not notarized, so the first time macOS will say it is from an unidentified developer: right-click the app and choose Open, or run \`xattr -dr com.apple.quarantine Rackoon.app\` once. Verify the download with the .sha256 file."
